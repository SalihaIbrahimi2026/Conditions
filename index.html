<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <form action="" id="StuForm">
            <div>
                
            <input type="text" id="StuName" placeholder="Enter your name." value="" >
            <input type="number" id="age" placeholder="Enteryour age" value="" >
            <button id="age_btn">Check the Age</button>
            <p id="ageMsg"></p>

            </div>

            <div>
                <label>Enter a number to check its type</label>
                <input type="number" id="num" value="" >
                <p id="numMsg"></p>
            </div>
            <div>
                <label>Enter the score to see the grade</label>
                <input type="number" id="grade" value="">
                <p id="gradeChecker"></p>
            </div>
            <div>
                <input type="text" id="StudentName" placeholder="Type your name here" value="" required>
                <input type="number" id="score" placeholder="Enter your score here" value="" >
                <p id="ScoreMsg"></p>
            </div>
            <div>
                <input type="number" id="EvenOdd" placeholder="Even or Odd" value="">
                <p id="numType"></p>
            </div>
            <div>
                <input type="text" id="username" placeholder="Enter your username" value="">
                <input type="password" id="password" placeholder="Enter your password" value="">
                <button id="login-btn">Log in</button>
                <p id="login"></p>
               
            </div>
            <div>
                <input type="number" id="AGE" placeholder="Your Age" value="">
                <label>
                    <input type="checkbox" id="hasID">
                    I have an ID.
                </label>
                <button id="check_btn">Check Access</button>
                <p id="accessMsg"></p>
            </div>
           
             <button id="submit">Submit</button>
            
            
        </form>
        
        
        <script src="script.js"></script>
        
    
</body>
</html>
